[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv-portfolio", "Pathway/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
source = ["Pathway"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "*/tests.py", "*/admin.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
