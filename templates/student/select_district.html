{% extends "auth/base.html" %}
{% block title %}Choose district | AtlasOne{% endblock %}
{% block content %}
    <h1>Choose your district</h1>
    <p>Your district determines the course catalog and graduation requirements.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Continue</button>
    </form>
{% endblock %}
