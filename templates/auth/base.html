{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AtlasOne{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'AtlasOne-logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="auth-card">
        <a class="brand" href="{% url 'home' %}">AtlasOne<span>ACADEMIC PLANNING</span></a>
        {% for message in messages %}
            <p class="notice" role="status">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
